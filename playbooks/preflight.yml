---
- name: Preflight readiness and recovery preparation
  hosts: all
  gather_facts: false
  become: true
  any_errors_fatal: false
  tasks:
    - name: Run fixed preflight checks
      preflight:
        host_name: "{{ inventory_hostname }}"
        expectations: "{{ preflight_expectations | default([]) }}"
        disk_paths: "{{ preflight_disk_paths | default(['/', '/var/cache/apt/archives']) }}"
        min_free_bytes: "{{ preflight_min_free_bytes | default(536870912) }}"
        backup_root: "{{ preflight_backup_root | default(omit) }}"
        config_paths: "{{ preflight_config_paths | default([]) }}"
        max_backup_bytes: "{{ preflight_max_backup_bytes | default(67108864) }}"
        recovery_artifact_dir: "{{ preflight_recovery_artifact_dir | default(omit) }}"
        recovery_artifacts: "{{ preflight_recovery_artifacts | default([]) }}"
        cache_previous: "{{ preflight_cache_previous | default(false) }}"
      register: preflight_result
      ignore_unreachable: true
      failed_when: false

    - name: Record preflight completion time
      ansible.builtin.set_fact:
        preflight_completed_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
      run_once: true

    - name: Normalize this host's preflight record
      ansible.builtin.set_fact:
        host_preflight: >-
          {{
            {
              'status': preflight_result.status,
              'collected_at': preflight_result.collected_at,
              'checks': preflight_result.checks,
              'backup': preflight_result.backup,
              'recovery_artifacts': preflight_result.recovery_artifacts,
              'blocking': preflight_result.blocking,
              'error': preflight_result.error
            }
            if ((preflight_result | default({})).status | default('')) in ['ready', 'not_ready', 'error']
            else {
              'status': 'error',
              'collected_at': preflight_completed_at,
              'checks': [],
              'backup': {
                'status': 'not_attempted',
                'detail': 'Preflight did not run',
                'files': []
              },
              'recovery_artifacts': {
                'status': 'not_attempted',
                'detail': 'Preflight did not run',
                'artifacts': []
              },
              'blocking': ['preflight_failed'],
              'error': {
                'code': 'preflight_failed',
                'message': 'Host did not return structured preflight results'
              }
            }
          }}

    - name: Define fallback preflight for unreachable hosts
      ansible.builtin.set_fact:
        unreachable_preflight:
          status: error
          collected_at: "{{ preflight_completed_at }}"
          checks: []
          backup:
            status: not_attempted
            detail: Preflight did not run
            files: []
          recovery_artifacts:
            status: not_attempted
            detail: Preflight did not run
            artifacts: []
          blocking:
            - unreachable
          error:
            code: unreachable
            message: Host was unreachable during preflight
      run_once: true

    - name: Assemble fleet preflight evidence v1
      ansible.builtin.set_fact:
        fleet_preflight: >-
          {{
            {
              'schema_version': 1,
              'collected_at': preflight_completed_at,
              'targets': ansible_play_hosts_all,
              'hosts': dict(
                ansible_play_hosts_all | zip(
                  ansible_play_hosts_all
                  | map('extract', hostvars)
                  | map(attribute='host_preflight', default=unreachable_preflight)
                )
              )
            }
          }}
      run_once: true

    - name: Emit fleet preflight evidence v1
      ansible.builtin.debug:
        var: fleet_preflight
      run_once: true

    - name: Abort when any target is not ready
      ansible.builtin.fail:
        msg: >-
          Preflight did not pass on every target. No packages were changed.
          Review the emitted fleet_preflight record for blocking checks.
      when: >-
        fleet_preflight.hosts | dict2items
        | rejectattr('value.status', 'equalto', 'ready') | list | length > 0
      run_once: true

    # This playbook never installs, upgrades, downgrades, restarts a service or
    # starts a Semaphore job. Patch and recovery stay blocked by their own gates.
