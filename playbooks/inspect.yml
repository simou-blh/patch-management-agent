---
- name: Read installed package and repository evidence
  hosts: all
  gather_facts: false
  tasks:
    - name: Read package facts without refreshing APT indexes
      ansible.builtin.package_facts:
        manager: apt

    - name: Read configured repository policy
      ansible.builtin.command:
        argv: [apt-cache, policy]
      register: repository_policy
      changed_when: false

    - name: Return inspection evidence
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          packages: "{{ ansible_facts.packages }}"
          repository_policy: "{{ repository_policy.stdout }}"

    # TODO: fixed candidate/source-package collector, structured artifacts and freshness.
    # This playbook alone does not produce trusted data/evidence.json yet.
