---
- name: "Sequential fleet rollout: canary first, then fleet hosts"
  hosts: all
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: false
  vars:
    deployment_unblocked: false
  tasks:
    - name: Run preflight readiness check
      preflight:
        host_name: "{{ inventory_hostname }}"
        expectations: "{{ preflight_expectations | default([]) }}"
        disk_paths: "{{ preflight_disk_paths | default(['/', '/var/cache/apt/archives']) }}"
        min_free_bytes: "{{ preflight_min_free_bytes | default(536870912) }}"
        backup_root: "{{ preflight_backup_root | default(omit) }}"
        config_paths: "{{ preflight_config_paths | default([]) }}"
        max_backup_bytes: "{{ preflight_max_backup_bytes | default(67108864) }}"
        recovery_artifact_dir: "{{ preflight_recovery_artifact_dir | default(omit) }}"
        recovery_artifacts: "{{ preflight_recovery_artifacts | default([]) }}"
        cache_previous: "{{ preflight_cache_previous | default(false) }}"
      register: preflight_result
      ignore_unreachable: true
      failed_when: false

    - name: Run exact-version patch
      patch_packages:
        target: "{{ inventory_hostname }}"
        expectations: "{{ patch_expectations | default([]) }}"
        candidates: "{{ patch_candidates | default({}) }}"
        policy: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../policies/services.json') | from_json }}"
        deployment_unblocked: "{{ deployment_unblocked }}"
      register: patch_result
      ignore_unreachable: true
      failed_when: false

    - name: Verify observed versions and health checks
      verify_packages:
        target: "{{ inventory_hostname }}"
        expectations: "{{ verify_expectations | default([]) }}"
        policy: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../policies/services.json') | from_json }}"
        deployment_unblocked: "{{ deployment_unblocked }}"
      register: verify_result
      ignore_unreachable: true
      failed_when: false

    - name: Decide proceed or recover for this host
      sequential_rollout:
        target: "{{ inventory_hostname }}"
        preflight_status: "{{ preflight_result.status | default('error') }}"
        patch_status: "{{ patch_result.status | default('error') }}"
        verify_status: "{{ verify_result.status | default('error') }}"
      register: rollout_decision
      ignore_unreachable: true
      failed_when: false

    - name: Recover failed host only
      recover_packages:
        target: "{{ inventory_hostname }}"
        previous_packages: "{{ recover_previous_packages | default([]) }}"
        config_paths: "{{ recover_config_paths | default([]) }}"
        backup_root: "{{ recover_backup_root | default(omit) }}"
        deployment_unblocked: "{{ deployment_unblocked }}"
      when: (rollout_decision.action | default('recover')) == 'recover'
      ignore_unreachable: true
      failed_when: false

    - name: Emit rollout decision for this host
      ansible.builtin.debug:
        var: rollout_decision

    - name: Stop rollout when a host needs recovery
      ansible.builtin.fail:
        msg: >-
          Rollout stopped on {{ inventory_hostname }}. Recovery ran on this host
          only. Later fleet hosts remain untouched.
      when: (rollout_decision.action | default('recover')) == 'recover'

    # This playbook executes preflight, patch and verify one host at a time
    # (serial: 1). When any step fails on a host, recovery runs on that host
    # only and the fail gate stops the rollout before the next host. No host
    # after a failure is ever touched. Deployment stays blocked until every
    # live Sprint 3/4 gate has passed.
