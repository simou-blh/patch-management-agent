[project]
name = "patch-management-agent"
version = "0.1.0"
description = "MVP foundation: read-only fleet inventory and human approval gate"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "jsonschema==4.26.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "PyYAML==6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
